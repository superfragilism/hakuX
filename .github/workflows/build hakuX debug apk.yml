name: Build hakuX debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK, build tools and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0 ndk;29.0.14206865 cmake;3.31.6"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3

      - name: FEX fork and its submodules
        run: |
          git submodule update --init external/fex
          git -C external/fex submodule update --init External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Third-party sources (NC_DEPS)
        run: |
          D=$HOME/native-deps
          mkdir -p $D/root/subprojects
          git clone --depth 1 --branch 1.4.304 https://github.com/zeux/volk $D/volk
          git clone --depth 1 --branch 16.1.0 https://github.com/KhronosGroup/glslang $D/glslang
          git clone --depth 1 --branch vulkan-sdk-1.4.328.0 https://github.com/KhronosGroup/SPIRV-Reflect $D/spirv_reflect
          git clone --depth 1 --branch v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator $D/vma
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL $D/SDL3
          git clone --depth 1 --branch v4.7.0 https://gitlab.freedesktop.org/slirp/libslirp $D/libslirp
          git clone https://github.com/abaire/nv2a_vsh_cpu $D/root/subprojects/nv2a_vsh_cpu
          git -C $D/root/subprojects/nv2a_vsh_cpu checkout 561fe80
          git clone --recursive https://github.com/bylaws/libadrenotools $D/adrenotools
          git -C $D/adrenotools checkout 8fae8ce
          git -C $D/adrenotools submodule update --init --recursive
          git -C $D/adrenotools apply "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"
          echo "NC_DEPS=$D" >> $GITHUB_ENV

      - name: Build the native core
        run: |
          export ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS=$NC_DEPS
          ninja -C build/native/core hakuxcore
          bash tools/native/app-libs.sh

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: hakuX-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
